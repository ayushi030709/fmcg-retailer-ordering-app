name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fmcg
          POSTGRES_PASSWORD: fmcg
          POSTGRES_DB: fmcg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fmcg" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL, incl. concurrency)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fmcg:fmcg@localhost:5432/fmcg_test
      - name: Migration applies cleanly and matches models
        run: |
          psql postgresql://fmcg:fmcg@localhost:5432/postgres -c "CREATE DATABASE fmcg_migrate"
          alembic upgrade head
          alembic check
          python -m app.seed
        env:
          DATABASE_URL: postgresql+psycopg://fmcg:fmcg@localhost:5432/fmcg_migrate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
